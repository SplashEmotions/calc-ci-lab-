stages:
  - lint
  - test
  - build

lint:
  stage: lint
  image: python:3.11
  script:
    - pip install -r requirements-dev.txt
    - flake8 src tests

test:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  script:
    - pip install -r requirements-dev.txt
    - pytest --cov=calc